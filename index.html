<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-BIT 2026 STRATEGIC V14.2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-card { background: white; border-radius: 2.5rem; border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 4px 25px rgba(0,0,0,0.04); }
        .input-base { background: #f8fafc; border: 2px solid transparent; border-radius: 1.25rem; padding: 0.8rem 1.5rem; font-weight: 700; outline: none; font-size: 14px; width: 100%; transition: all 0.3s; }
        .input-base:focus { border-color: #3b82f6; background: white; }
        .matrix-input-v { width: 100%; text-align: center; background: transparent; border: 1px solid transparent; outline: none; font-size: 12px; font-weight: 800; padding: 4px; border-radius: 4px; }
        .matrix-input-v:focus { border-color: #3b82f6; background: white; }
        .sticky-col { position: sticky; left: 0; background: white; z-index: 20; width: 140px !important; border-right: 2px solid #f1f5f9; padding: 8px !important; font-size: 11px; }
        .sub-row { display: none; }
        .sub-row.show-row { display: table-row !important; }
        .group-row { background-color: #f8fafc !important; border-bottom: 2px solid #f1f5f9; }
        .alert-red { background-color: #fee2e2 !important; color: #dc2626 !important; }
    </style>
</head>
<body class="text-slate-900 p-4 md:p-8">

    <div id="login-wall" class="fixed inset-0 z-[500] flex flex-col items-center justify-center bg-slate-50">
        <h1 class="text-6xl font-black mb-8 italic uppercase text-slate-950">8-BIT</h1>
        <div class="glass-card p-12 w-full max-w-[400px] text-center">
            <input id="pw_field" type="password" placeholder="PASSWORD" class="input-base text-center text-xl mb-6">
            <button onclick="triggerLogin()" class="w-full bg-slate-950 text-white font-black py-5 rounded-2xl hover:bg-blue-600 transition-all uppercase">Enter Terminal</button>
        </div>
    </div>

    <div id="app-content" class="hidden opacity-0 transition-opacity duration-700 max-w-[1600px] mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-black italic tracking-tighter uppercase">8-BIT / 2026</h2>
            <div class="flex gap-3">
                <button onclick="toggleMatrix()" class="bg-blue-600 text-white text-[11px] font-black px-8 py-4 rounded-full shadow-lg uppercase tracking-widest">年度預算矩陣</button>
                <button onclick="logout()" class="text-slate-400 text-[11px] font-black uppercase px-4">Logout</button>
            </div>
        </header>

        <div id="annual-dashboard" class="mb-10 w-full"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-card p-6 flex flex-col gap-5">
                    <div class="relative flex items-center bg-slate-100 rounded-2xl px-6 py-3">
                        <span class="mr-2">🔍</span>
                        <input type="text" id="searchInput" oninput="filterAll()" placeholder="搜尋子項目或備註..." class="bg-transparent border-none w-full font-bold text-sm outline-none">
                    </div>
                    <div class="flex items-center justify-between px-3">
                        <input type="month" id="monthFilter" value="2026-01" onchange="fetchCloudData()" class="bg-transparent font-black text-base outline-none">
                        <h3 id="month-net-val" class="text-2xl font-black italic text-slate-950">$0</h3>
                    </div>
                </div>
                <div id="detailList" class="glass-card p-8 h-[600px] overflow-y-auto no-scrollbar space-y-3"></div>
            </div>

            <div class="lg:col-span-7">
                <div class="glass-card p-12" id="input-container">
                    <div class="space-y-6">
                        <div class="grid grid-cols-2 gap-8">
                            <input id="trans_date" type="date" class="input-base text-xs">
                            <select id="type" onchange="refreshCategories()" class="input-base text-xs">
                                <option value="expense">支出 (-)</option>
                                <option value="income">收入 (+)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-8">
                            <div class="flex flex-col">
                                <label class="text-[9px] font-black text-slate-300 uppercase mb-2 ml-4">Currency</label>
                                <div class="flex bg-slate-100 p-1 rounded-2xl" id="currency_toggle">
                                    <button onclick="setCurrency('TWD')" class="flex-1 py-1.5 text-[9px] font-black rounded-xl transition-all bg-white shadow-sm text-slate-950" data-val="TWD">TWD</button>
                                    <button onclick="setCurrency('JPY')" class="flex-1 py-1.5 text-[9px] font-black rounded-xl transition-all text-slate-400" data-val="JPY">JPY</button>
                                    <button onclick="setCurrency('CNY')" class="flex-1 py-1.5 text-[9px] font-black rounded-xl transition-all text-slate-400" data-val="CNY">CNY</button>
                                </div>
                                <input type="hidden" id="currency_type" value="TWD">
                            </div>
                            <div class="flex flex-col">
                                <label class="text-[9px] font-black text-slate-300 uppercase mb-2 ml-4">Tax Status</label>
                                <div class="flex bg-slate-100 p-1 rounded-2xl" id="tax_toggle">
                                    <button onclick="setTaxMode('NET')" class="flex-1 py-1.5 text-[9px] font-black rounded-xl transition-all bg-white shadow-sm text-slate-950" data-val="NET">未稅</button>
                                    <button onclick="setTaxMode('GROSS')" class="flex-1 py-1.5 text-[9px] font-black rounded-xl transition-all text-slate-400" data-val="GROSS">含稅</button>
                                </div>
                                <input type="hidden" id="tax_mode" value="NET">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-8">
                            <select id="main_cat" onchange="updateSubOptions()" class="input-base text-xs"></select>
                            <select id="sub_cat" class="input-base text-xs"></select>
                        </div>
                        <div class="w-full"><input id="note_field" type="text" placeholder="備註內容 / #標籤" class="input-base text-xs w-full"></div>
                        <div class="pt-6 flex items-baseline gap-4 border-t">
                            <span class="text-slate-300 font-black text-2xl">$</span>
                            <input id="amt_view" type="text" placeholder="0" onfocus="numPlain(this)" onblur="numFormat(this)" class="w-full text-slate-950 text-6xl font-black outline-none bg-transparent">
                            <input type="hidden" id="amt_val" value="0">
                        </div>
                        <div id="action-buttons" class="flex gap-4">
                            <button id="main-submit-btn" onclick="submitToCloud()" class="w-full bg-slate-950 text-white py-6 rounded-[2rem] font-black text-lg hover:bg-slate-800 transition-all uppercase tracking-widest">ADD TRANSACTION</button>
                            <button id="cancel-edit-btn" onclick="resetForm()" class="hidden flex-1 bg-slate-100 text-slate-400 py-6 rounded-[2rem] font-black text-lg hover:bg-slate-200 transition-all uppercase tracking-widest">CANCEL</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="matrix-modal" class="hidden fixed inset-0 z-[400] bg-slate-900/95 backdrop-blur-xl p-4 flex flex-col items-center justify-center">
        <div class="w-full max-w-[1700px] mb-6 flex gap-6 items-end">
            <div class="flex-1 bg-white/10 p-6 rounded-[2rem] border border-white/20">
                <label class="block text-[10px] font-black text-green-400 mb-1 tracking-widest uppercase">2026 Yearly Revenue Target</label>
                <input type="text" id="yearly-revenue-goal" oninput="formatAndSyncYearly(this, 'revenue')" class="w-full bg-transparent text-4xl font-black text-white outline-none" placeholder="$ 0">
            </div>
            <div class="flex-1 bg-white/10 p-6 rounded-[2rem] border border-white/20">
                <label class="block text-[10px] font-black text-blue-400 mb-1 tracking-widest uppercase">2026 Yearly Expense Budget</label>
                <input type="text" id="yearly-expense-goal" oninput="formatAndSyncYearly(this, 'expense')" class="w-full bg-transparent text-4xl font-black text-white outline-none" placeholder="$ 0">
            </div>
            <button onclick="toggleMatrix()" class="text-white text-5xl font-light px-6 hover:text-red-500 transition-colors">✕</button>
        </div>
        <div class="w-full max-w-[1700px] bg-white rounded-[3rem] shadow-2xl flex flex-col h-[70vh] overflow-hidden">
            <div class="overflow-auto flex-1 no-scrollbar"><table class="w-full table-fixed border-collapse text-left"><tbody id="matrix-body"></tbody></table></div>
            <div class="px-10 py-6 bg-slate-950 text-white flex justify-between items-center">
                <div class="flex gap-12">
                    <div><span class="text-[10px] text-slate-500 block font-bold uppercase mb-1">Revenue Allocated</span><div class="flex items-baseline gap-2"><b id="total-revenue-percent" class="text-2xl italic font-black">0%</b><span id="total-revenue-amt" class="text-sm text-slate-400 font-bold">$0</span></div></div>
                    <div class="border-l border-white/10 pl-12"><span class="text-[10px] text-slate-500 block font-bold uppercase mb-1">Expense Allocated</span><div class="flex items-baseline gap-2"><b id="total-expense-percent" class="text-2xl italic font-black">0%</b><span id="total-expense-amt" class="text-sm text-slate-400 font-bold">$0</span></div></div>
                </div>
                <button onclick="saveAndReload()" class="bg-blue-600 hover:bg-blue-500 text-white px-12 py-4 rounded-2xl font-black text-sm tracking-widest">SAVE & UPDATE STRATEGY</button>
            </div>
        </div>
    </div>

<script>
    const SB_URL = "https://utvynjzwmkptsvfyhfhf.supabase.co";
    const SB_KEY = "sb_publishable_3Q0nQfsGi7MknHHwHmED7g_qvjDNikH";
    const _client = supabase.createClient(SB_URL, SB_KEY);
    
    let budgetMap, revenueMap, localData, currentFetchedData = [];
    let editingId = null;

    window.onload = () => { setupData(); if(localStorage.getItem('8bit_logged') === 'true') showApp(); };
    
    function setupData() {
        revenueMap = { "線上通路": ["台灣官網", "日本官網"], "線下通路": ["固定櫃", "寄售點", "pop up活動"], "B2B/其他": ["一般代工", "藝術品委託", "其他收入"] };
        budgetMap = { "產品開發與採購": ["樣紗/樣本副料", "打樣/加工費", "藝術家授權金", "生產大貨款", "大貨輔料", "採購與開發運費", "參考原樣費"], "物流與倉儲營運": ["日本倉租", "銷貨運費", "通路調撥", "出貨耗材", "其他"], "行銷推廣與拍攝": ["廣告投放", "形象拍攝", "KOL合作", "CRM花費", "行銷佈置"], "通路租金與抽成": ["店員薪資", "通路包底租金", "通路抽成", "通路雜支", "官網平台費", "官網手續費"], "人事與管理": ["員工薪資", "差旅費用", "勞健保預退", "系統訂閱費", "福利支出", "教育訓練", "應酬費", "顧問費", "行政雜項"], "短期專案/Pop-up": ["快閃場地", "臨時薪資", "運費雜支", "差旅費用", "進場裝潢費", "撤場清潔費"] };
        localData = JSON.parse(localStorage.getItem('8bit_v100_matrix')) || {};
    }

    // --- 登入與基礎 ---
    function triggerLogin() { if(document.getElementById('pw_field').value === "8bit2026") { localStorage.setItem('8bit_logged', 'true'); showApp(); } else { alert("ACCESS DENIED"); } }
    function showApp() { document.getElementById('login-wall').style.display='none'; document.getElementById('app-content').classList.remove('hidden'); setTimeout(()=>document.getElementById('app-content').classList.add('opacity-100'),50); refreshCategories(); fetchCloudData(); }
    function logout() { localStorage.removeItem('8bit_logged'); location.reload(); }

    // --- 搜尋與過濾 (完整版) ---
    function setSearch(val) {
        const input = document.getElementById('searchInput');
        if (input) { input.value = val; filterAll(); }
    }

    function filterAll() {
        const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
        const filterMonthStr = document.getElementById('monthFilter').value;
        const monthlyData = currentFetchedData.filter(i => {
            return i.created_at.startsWith(filterMonthStr) && (keyword === "" || i.subcategory.toLowerCase().includes(keyword) || i.main_category.toLowerCase().includes(keyword) || (i.note || "").toLowerCase().includes(keyword));
        });

        const list = document.getElementById('detailList');
        list.innerHTML = ''; let mNet = 0; let searchTotal = 0;

        monthlyData.forEach(i => {
            const isInc = i.type === 'income';
            mNet += (isInc ? i.amount : -i.amount);
            searchTotal += i.amount;
            const rawNote = i.note || "";
            const taxMatch = rawNote.match(/\[TAX_INCL:(.*?)\]/);
            const originalAmount = taxMatch ? taxMatch[1] : "";
            const cleanNote = rawNote.replace(/\[TAX_INCL:.*?\]/g, "").trim();
            const displayNote = cleanNote.replace(/(#[\w\u4e00-\u9fa5]+)/g, `<span class="text-blue-500 cursor-pointer hover:underline" onclick="event.stopPropagation(); setSearch('$1')">$1</span>`);

            list.innerHTML += `
                <div class="group bg-white p-5 rounded-[2rem] flex justify-between items-center mb-4 cursor-pointer hover:ring-2 hover:ring-blue-400 transition-all shadow-sm">
                    <div onclick='openEditMode(${JSON.stringify(i)})' class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="px-2 py-0.5 bg-blue-50 text-blue-600 text-[9px] font-black rounded-full uppercase">${i.subcategory}</span>
                            <span class="text-[9px] text-slate-300 font-bold uppercase">${i.main_category}</span>
                        </div>
                        <p class="text-[10px] text-slate-400 font-medium">${i.created_at.slice(8, 10)}日 | ${displayNote} ${originalAmount ? `<span class="ml-2 px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded text-[8px] font-bold">${originalAmount}</span>` : ""}</p>
                    </div>
                    <div class="flex items-center gap-4"><b class="text-xl font-black italic ${isInc?'text-green-600':'text-slate-950'}">$${i.amount.toLocaleString()}</b><button onclick="deleteTransaction(${i.id}, event)" class="p-2 text-slate-200 hover:text-red-500 transition-colors"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button></div>
                </div>`;
        });
        if (keyword !== "") {
            list.innerHTML += `<div class="sticky bottom-0 bg-slate-950 text-white p-6 rounded-[2rem] flex justify-between items-center shadow-2xl mt-4 border-t border-white/10"><span class="text-[10px] font-black tracking-widest uppercase opacity-60">Search Total</span><b class="text-2xl font-black italic text-green-400">$${searchTotal.toLocaleString()}</b></div>`;
        }
        document.getElementById('month-net-val').innerText = `$${mNet.toLocaleString()}`;
        updateDashboard();
    }

    // --- 儀表板與進度條 ---
    function updateDashboard() {
        let yR = 0, yE = 0; let catM = {}, catY = {};
        const filterStr = document.getElementById('monthFilter').value;
        const revGoal = parseInt(document.getElementById('yearly-revenue-goal')?.value.replace(/,/g, '')) || 0;
        const expGoal = parseInt(document.getElementById('yearly-expense-goal')?.value.replace(/,/g, '')) || 0;

        currentFetchedData.forEach(i => {
            if (i.created_at.startsWith("2026")) {
                if (i.type==='income') yR+=i.amount; else yE+=i.amount;
                catY[i.main_category] = (catY[i.main_category]||0) + i.amount;
            }
            if (i.created_at.startsWith(filterStr)) catM[i.main_category] = (catM[i.main_category]||0) + i.amount;
        });

        const createBar = (title, actM, type) => {
            const pct = parseFloat(document.querySelector(`input[data-main-cat="${title}"]`)?.value) || 0;
            const target = (type==='income'?revGoal:expGoal) * (pct/100);
            const mTarget = target/12;
            const mProg = mTarget>0 ? Math.min(actM/mTarget*100, 100) : 0;
            const yProg = target>0 ? (catY[title]/target*100).toFixed(1) : "0.0";
            const color = type==='income'?'bg-blue-600':(mProg>95?'bg-red-500':'bg-slate-900');

            return `<div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-50 flex flex-col gap-3">
                <div class="flex justify-between items-end">
                    <div><b class="text-xs text-slate-800 uppercase font-black block mb-1">${title}</b><span class="text-[9px] text-slate-400 font-bold uppercase">Monthly: ${mProg.toFixed(1)}%</span></div>
                    <div class="text-right"><b class="text-lg text-slate-950 font-black italic block">$${actM.toLocaleString()}</b><span class="text-[9px] text-slate-400 font-bold uppercase">Yearly Cum.: ${yProg}%</span></div>
                </div>
                <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${color} transition-all duration-1000" style="width: ${mProg}%"></div></div>
            </div>`;
        };

        const inCats = ["線上通路", "線下通路", "B2B/其他"];
        const exCats = ["產品開發與採購", "物流與倉儲營運", "行銷推廣與拍攝", "通路租金與抽成", "人事與管理", "短期專案/Pop-up"];
        const dash = document.getElementById('annual-dashboard');
        if (dash) {
            dash.innerHTML = `<div class="w-full flex flex-col gap-10">
                <div class="bg-[#0F172A] p-10 md:p-14 rounded-[3rem] shadow-2xl text-white">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-10 max-w-7xl mx-auto text-center md:text-left">
                        <div><p class="text-[10px] text-slate-500 font-black mb-2 uppercase">Total Revenue 2026</p><h3 class="text-5xl font-black italic">$${yR.toLocaleString()}</h3></div>
                        <div><p class="text-[10px] text-slate-500 font-black mb-2 uppercase">Total Expense 2026</p><h3 class="text-5xl font-black italic">$${yE.toLocaleString()}</h3></div>
                        <div><p class="text-[10px] text-slate-500 font-black mb-2 uppercase">Net Profit</p><h3 class="text-5xl font-black italic ${yR-yE>=0?'text-green-400':'text-red-500'}">$${(yR-yE).toLocaleString()}</h3></div>
                    </div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <section class="space-y-4"><h4 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.4em] ml-2">Income</h4>${inCats.map(c=>createBar(c,catM[c]||0,'income')).join('')}</section>
                    <section class="space-y-4"><h4 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.4em] ml-2">Expense</h4>${exCats.map(c=>createBar(c,catM[c]||0,'expense')).join('')}</section>
                </div>
            </div>`;
        }
    }

    // --- 其他邏輯 (矩陣、資料存取) ---
    async function fetchCloudData() { const {data,error} = await _client.from('transactions').select('*'); if(!error){currentFetchedData=data||[]; filterAll();} }
    async function submitToCloud() {
        const amt = parseInt(document.getElementById('amt_val').value) || 0;
        if(amt === 0) return alert("請輸入金額");
        const payload = { created_at: document.getElementById('trans_date').value, amount: amt, type: document.getElementById('type').value, main_category: document.getElementById('main_cat').value, subcategory: document.getElementById('sub_cat').value, note: document.getElementById('note_field').value };
        const res = editingId ? await _client.from('transactions').update(payload).eq('id', editingId) : await _client.from('transactions').insert([payload]);
        if(!res.error){ resetForm(); fetchCloudData(); }
    }

    function renderMatrixTable() {
        const body = document.getElementById('matrix-body'); body.innerHTML = '';
        const months = Array.from({length: 12}, (_, i) => i + 1);
        let header = `<tr class="sticky top-0 z-30 bg-white border-b shadow-sm"><th class="sticky-col text-[10px] font-black text-slate-400 uppercase">Category / %</th>`;
        months.forEach(m => { header += `<th class="w-[100px] text-center text-[10px] font-black text-slate-400">${m}M</th>`; });
        body.innerHTML += header + `</tr>`;
        const sections = [{ n: "REVENUE TARGETS", m: revenueMap }, { n: "EXPENSE BUDGETS", m: budgetMap }];
        sections.forEach(sec => {
            body.innerHTML += `<tr class="bg-slate-50"><td colspan="13" class="p-4 text-[10px] font-black text-slate-400 uppercase text-center">${sec.n}</td></tr>`;
            Object.keys(sec.m).forEach(main => {
                const isRev = sec.n.includes("REVENUE");
                let row = `<tr class="group-row border-b"><td class="sticky-col"><div class="flex flex-col gap-1.5"><span class="cursor-pointer font-bold text-slate-700" onclick="toggleSubRows('${main}')">▶ ${main}</span><div class="flex items-center gap-1"><input type="number" step="0.1" data-main-cat="${main}" data-type="${isRev?'revenue':'expense'}" class="w-16 border rounded text-[11px] font-black text-blue-600 px-1" value="${getCurrentPercent(main, sec.n)}" onchange="distributeByPercent('${main}', '${sec.n}', this)">%</div></div></td>`;
                months.forEach(m => {
                    const sum = sec.m[main].reduce((s, sub) => s + (localData[main]?.[sub]?.amounts?.[m] || 0), 0);
                    row += `<td class="p-1 border-r"><input type="text" class="matrix-input-v ${sum>0?(isRev?'text-green-600':'text-blue-600'):''}" value="${sum.toLocaleString()}" onblur="distributeMainToSubs('${main}', ${m}, this)"></td>`;
                });
                body.innerHTML += row + `</tr>`;
                sec.m[main].forEach(sub => {
                    let subRow = `<tr class="sub-row sub-${main} border-b border-dashed border-slate-50"><td class="sticky-col !pl-8 bg-white italic text-slate-400 text-[10px]"><div><span>${sub}</span><div class="flex items-center mt-0.5"><input type="number" class="w-10 border-b outline-none text-blue-500 font-bold bg-transparent" value="${localData[main]?.[sub]?.percent || 0}" step="0.1" onchange="updateSubPercent('${main}', '${sub}', this.value)">%</div></div></td>`;
                    months.forEach(m => { subRow += `<td class="p-1 border-r border-slate-50 border-dashed"><input type="text" class="matrix-input-v !font-normal text-slate-400" value="${(localData[main]?.[sub]?.amounts?.[m] || 0).toLocaleString()}" onblur="updateMatrixVal('${main}','${sub}',${m},this)"></td>`; });
                    body.innerHTML += subRow + `</tr>`;
                });
            });
        });
        updateMatrixSummary();
    }

    // 輔助函數 (補齊)
    function updateSubPercent(m, s, p) { if(!localData[m]) localData[m]={}; if(!localData[m][s]) localData[m][s]={amounts:{}}; localData[m][s].percent=parseFloat(p)||0; renderMatrixTable(); }
    function getCurrentPercent(main, sec) { const isRev=sec.includes("REVENUE"); const goal=parseInt(document.getElementById(isRev?'yearly-revenue-goal':'yearly-expense-goal').value.replace(/,/g,''))||0; if(goal===0) return 0; let sum=0; const subs=(revenueMap[main]||budgetMap[main]); for(let m=1;m<=12;m++){subs.forEach(s=>{sum+=(localData[main]?.[s]?.amounts?.[m]||0);});} return (sum/goal*100).toFixed(1); }
    function distributeByPercent(main, sec, el) { const isRev=sec.includes("REVENUE"); const goal=parseInt(document.getElementById(isRev?'yearly-revenue-goal':'yearly-expense-goal').value.replace(/,/g,''))||0; if(goal===0) return alert("請先輸入金額"); const p=parseFloat(el.value)||0; const perM=Math.round(goal*(p/100)/12); const subs=(revenueMap[main]||budgetMap[main]); const perS=Math.round(perM/subs.length); if(!localData[main]) localData[main]={}; subs.forEach(s=>{ if(!localData[main][s]) localData[main][s]={amounts:{}}; for(let m=1;m<=12;m++) localData[main][s].amounts[m]=perS; }); renderMatrixTable(); }
    function distributeMainToSubs(main, m, el) { const val=parseInt(el.value.replace(/,/g,''))||0; const subs=(revenueMap[main]||budgetMap[main]); const perS=Math.round(val/subs.length); if(!localData[main]) localData[main]={}; subs.forEach(s=>{ if(!localData[main][s]) localData[main][s]={amounts:{}}; localData[main][s].amounts[m]=perS; }); renderMatrixTable(); }
    function updateMatrixVal(m, s, mo, el) { if(!localData[m])localData[m]={}; if(!localData[m][s])localData[m][s]={amounts:{}}; localData[m][s].amounts[mo]=parseInt(el.value.replace(/,/g,''))||0; renderMatrixTable(); }
    function updateMatrixSummary() { ['revenue','expense'].forEach(t=>{ const goal=parseInt(document.getElementById(`yearly-${t}-goal`).value.replace(/,/g,''))||0; let sumP=0; document.querySelectorAll(`input[data-type="${t}"]`).forEach(el=>sumP+=parseFloat(el.value)||0); document.getElementById(`total-${t}-percent`).innerText=sumP.toFixed(1)+"%"; document.getElementById(`total-${t}-amt`).innerText="$"+Math.round(goal*(sumP/100)).toLocaleString(); }); }
    function formatAndSyncYearly(el, t) { let raw=el.value.replace(/\D/g,""); if(raw!=="") el.value=Number(raw).toLocaleString(); updateMatrixSummary(); }
    function toggleMatrix() { document.getElementById('matrix-modal').classList.toggle('hidden'); if(!document.getElementById('matrix-modal').classList.contains('hidden')) renderMatrixTable(); }
    function toggleSubRows(main) { document.querySelectorAll(`.sub-${main}`).forEach(el => el.classList.toggle('show-row')); }
    function saveAndReload() { localStorage.setItem('8bit_v100_matrix', JSON.stringify(localData)); toggleMatrix(); fetchCloudData(); }
    function refreshCategories() { const t=document.getElementById('type').value, m=document.getElementById('main_cat'); m.innerHTML=''; const target=(t==='income'?revenueMap:budgetMap); Object.keys(target).forEach(c=>m.innerHTML+=`<option value="${c}">${c}</option>`); updateSubOptions(); }
    function updateSubOptions() { const t=document.getElementById('type').value, m=document.getElementById('main_cat').value, s=document.getElementById('sub_cat'); s.innerHTML=''; const target=(t==='income'?revenueMap:budgetMap); if(target[m]) target[m].forEach(sub=>s.innerHTML+=`<option value="${sub}">${sub}</option>`); }
    function numPlain(el) { el.value=el.value.replace(/,/g,''); el.type='number'; }
    function numFormat(el) { const v=el.value; document.getElementById('amt_val').value=v; el.type='text'; el.value=v?Number(v).toLocaleString():''; }
    function resetForm() { editingId=null; document.getElementById('main-submit-btn').innerText="ADD TRANSACTION"; document.getElementById('cancel-edit-btn').classList.add('hidden'); document.getElementById('trans_date').value=new Date().toISOString().slice(0,10); document.getElementById('amt_view').value=''; document.getElementById('amt_val').value='0'; document.getElementById('note_field').value=''; refreshCategories(); }
</script>
</body>
</html>
